name: build

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]
  release:
    types: [ published ]

# No permissions by default; each job requests only what it needs.
permissions: {}

env:
  KAFKA_VERSION: '3.0.0'
  KAFKA_SCALA_VERSION: '2.13'
  # SHA-512 published by Apache at
  # https://archive.apache.org/dist/kafka/3.0.0/kafka_2.13-3.0.0.tgz.sha512
  KAFKA_SHA512: '86cdeb04af123399858d03431e9777948c1c40ec0d843966cf9bd90b8235b47ebbb5cb96d1f0660710b9286da86bbb5ee65e21e757606f5a1e67f970ae5cf57c'
  TWINE_VERSION: '6.2.0'

jobs:
  unittesting:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        os: [ ubuntu-latest ]
    env:
      HADOOP_USER_HOME: 'hadoop'
      UNIT_TESTING_ENV: 'spark_expectations_unit_testing_on_github_actions'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
              3.10
              3.11
              3.12
          check-latest: true
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install

      - name: Setup Kafka
        run: |
          archive="kafka_${KAFKA_SCALA_VERSION}-${KAFKA_VERSION}.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://archive.apache.org/dist/kafka/${KAFKA_VERSION}/${archive}"
          echo "${KAFKA_SHA512}  $RUNNER_TEMP/$archive" | sha512sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C /tmp
          echo "KAFKA_HOME=/tmp/kafka_${KAFKA_SCALA_VERSION}-${KAFKA_VERSION}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make deploy_env_setup

      - name: Install, lint and test
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export GITHUB_ACTIONS=true
          make cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true
          slug: Nike-Inc/spark-expectations
          token: ${{ secrets.CODECOV_TOKEN }}

  # Builds the release distributions without any publishing credential.
  build:
    name: Build distributions
    needs:
      - unittesting
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # tags are needed to derive the version
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
              3.10
              3.11
              3.12
          check-latest: true
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Determine and validate version
        id: version
        run: |
          export PATH=$PATH:$HOME/.local/bin
          raw_version="$(hatch version)"
          version="$(./.github/ci/validate_release_version.sh "$raw_version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make build
      - name: Check distributions
        run: |
          python -m pip install "twine==${TWINE_VERSION}"
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Uploads the exact artifacts produced by the build job. This is the only job
  # that receives the PyPI credential, and it runs no repository code.
  publish-pypi:
    name: Publish to PyPI
    needs:
      - build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install twine
        run: python -m pip install "twine==${TWINE_VERSION}"
      - name: Publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: python -m twine upload --non-interactive dist/*

  publish-docs:
    name: Publish docs
    needs:
      - build
      - publish-pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # Required to push the generated site to the gh-pages branch.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # fetch all commits/branches, needed for publish docs
      - name: Set up JDK
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
              3.10
              3.11
              3.12
          check-latest: true
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Install dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make deploy_env_setup
      - name: Publish Docs
        env:
          DOCS_VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH=$PATH:$HOME/.local/bin
          ./.github/ci/validate_release_version.sh "$DOCS_VERSION" > /dev/null
          make deploy-docs "version=$DOCS_VERSION"
