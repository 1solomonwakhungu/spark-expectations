name: "Publish GitHub Pages Docs"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to pass to docs command. Format: 'v1.2.3'"
        required: true

# No permissions by default; each job requests only what it needs.
permissions: {}

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate version input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate version
        id: validate
        # The input is passed through the environment and quoted, never
        # interpolated into the script text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(./.github/ci/validate_release_version.sh "$INPUT_VERSION")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  publish-gh-pages:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      # Required to push the generated site to the gh-pages branch.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # fetch all commits/branches, needed for publish docs
      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Set up JDK
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
              3.10
              3.11
              3.12
          check-latest: true
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Install dependencies
        run: |
          export PATH=$PATH:$HOME/.local/bin
          make deploy_env_setup
      - name: Publish Docs
        env:
          DOCS_VERSION: ${{ needs.validate-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/ci/validate_release_version.sh "$DOCS_VERSION" > /dev/null
          make deploy-docs "version=$DOCS_VERSION"
